<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <!-- maximum-scale and user-scalable switch zoom off: see src/noZoom.ts -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Junior Astronaut Mission Trainer</title>
    <meta name="description" content="Command a base on the Moon or Mars. Keep four astronauts alive and hit your science target: every hour spent on safety is one you can't spend on science. A browser game for the 2026 NASA Space Apps Challenge." />
    <meta name="theme-color" content="#0c1633" />
    <!-- Link previews (chat apps, social sites). Most of them need the full
         address of the picture: __SITE_URL__ is filled in when the site is
         built (see vite.config.ts). The picture comes from art/preview.py. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Junior Astronaut Mission Trainer" />
    <meta property="og:title" content="Junior Astronaut Mission Trainer" />
    <meta property="og:description" content="Command a base on the Moon or Mars. Keep four astronauts alive and hit your science target: every hour spent on safety is one you can't spend on science." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An isometric Moon base: a habitat dome, a lab, a greenhouse, solar panels, a reactor and a cargo lander on grey lunar ground." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
